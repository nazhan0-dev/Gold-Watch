spring:
  application:
    name: gold-price-tracker
  # Optional local overrides (e.g. the DB password) kept out of git; see backend/application-local.yml
  config:
    import: optional:file:./application-local.yml
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/goldtracker?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:goldtracker}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        # Bind java.time values with setObject() so neither the JVM time zone nor its locale
        # (e.g. a Thai Buddhist calendar) can alter stored timestamps. Instants are mapped to
        # UTC LocalDateTime by UtcInstantConverter.
        type:
          java_time_use_direct_jdbc: true
  flyway:
    enabled: true
  jackson:
    time-zone: UTC

server:
  # Render and most PaaS hosts pass the port in PORT; fall back to SERVER_PORT, then 8080.
  port: ${PORT:${SERVER_PORT:8080}}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

goldtracker:
  # Business time zone used for "today", daily/weekly buckets and parsing Thai announcements.
  zone: Asia/Bangkok
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  cache:
    latest-ttl: PT30S
  scheduler:
    enabled: ${SCHEDULER_ENABLED:true}
    # How often the Thai gold page is polled (ISO-8601 duration). Keep it polite: >= PT2M.
    interval: ${SCHEDULER_INTERVAL:PT5M}
    # How often world spot gold (gold-api.com) is polled. USD/THB still refreshes at most hourly.
    spot-interval: ${SPOT_SCHEDULER_INTERVAL:PT1M}
    initial-delay: PT10S
  http:
    connect-timeout: PT5S
    read-timeout: PT10S
    user-agent: "GoldPriceTracker/0.1 (personal learning project; polls at most every 5 minutes)"
  sources:
    gold-api:
      url: https://api.gold-api.com/price/XAU
    er-api:
      url: https://open.er-api.com/v6/latest/USD
      # The rate only changes once a day, so do not ask more often than this.
      min-refresh: PT1H
    # Fallback for XAU/USD when gold-api.com is unreachable (its DNS is unreliable on some hosts).
    # Unofficial public feed used by swissquote.com; the mid of bid/ask is stored.
    swissquote:
      url: https://forex-data-feed.swissquote.com/public-quotes/bboquotes/instrument/XAU/USD
    goldtraders:
      url: https://www.goldtraders.or.th/
