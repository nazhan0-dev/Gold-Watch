spring:
  application:
    name: gold-price-tracker
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/goldtracker?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true}
    username: ${DB_USERNAME:goldtracker}
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  jackson:
    time-zone: UTC

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

goldtracker:
  # Business time zone used for "today", daily/weekly buckets and parsing Thai announcements.
  zone: Asia/Bangkok
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  cache:
    latest-ttl: PT30S
  scheduler:
    enabled: ${SCHEDULER_ENABLED:true}
    # How often each source is polled (ISO-8601 duration).
    interval: ${SCHEDULER_INTERVAL:PT5M}
    initial-delay: PT10S
  http:
    connect-timeout: PT5S
    read-timeout: PT10S
    user-agent: "GoldPriceTracker/0.1 (personal learning project; polls at most every 5 minutes)"
  sources:
    gold-api:
      url: https://api.gold-api.com/price/XAU
    er-api:
      url: https://open.er-api.com/v6/latest/USD
      # The rate only changes once a day, so do not ask more often than this.
      min-refresh: PT1H
    goldtraders:
      url: https://www.goldtraders.or.th/
